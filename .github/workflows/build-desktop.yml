name: Build desktop apps

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows portable
            os: windows-latest
            command: package:win
            artifact: Prism-Windows
            files: release/*.exe
          - name: macOS Intel DMG
            os: macos-15-intel
            command: package:mac:x64
            artifact: Prism-macOS-Intel
            files: release/*.dmg
          - name: macOS Apple Silicon DMG
            os: macos-15
            command: package:mac:arm64
            artifact: Prism-macOS-Apple-Silicon
            files: release/*.dmg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:core
      - run: node scripts/test-product-ui.mjs
      - run: node scripts/smoke-electron-ui.mjs
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.artifact }}-failure-screens
          path: tmp/ui/*.png
          if-no-files-found: ignore
          retention-days: 7
